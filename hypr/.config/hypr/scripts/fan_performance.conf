# Optional fan hooks for ~/.config/hypr/scripts/power_profile.sh.
# Linuwu Sense fan_speed uses CPU,GPU percentages: 0 = auto, 100 = max.
FAN_TARGET_RPM=4000

PERFORMANCE_FAN_COMMAND='sudo -n /usr/local/bin/acer-fan-speed 50,50'
BALANCED_FAN_COMMAND='sudo -n /usr/local/bin/acer-fan-speed 0,0'
POWERSAVER_FAN_COMMAND='sudo -n /usr/local/bin/acer-fan-speed 0,0'
